# YOLOv7 舌象分类数据集配置文件
# 按照博客中的配置格式

# 訓練集與驗證集的路徑
train: ./data/images/train
val: ./data/images/val

# 分類數量
nc: 5

# 類別名稱 
names: ['Mirror-Approximated', 'Thin-White', 'White-Greasy', 'Yellow-Greasy', 'Grey-Black']

# 数据集信息
# 根据博客，数据集包含1472张高分辨率舌象图像
# 分类目标：Mirror-Approximated、Thin-white、White-Greasy、Yellow-Greasy、Grey-Black

# 下载链接（可选）
# download: https://github.com/ultralytics/yolov5/releases/download/v1.0/tongue_dataset.zip